services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - erp-internal

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Jwt__Issuer: ${JWT_ISSUER}
      Authentication__Jwt__Audience: ${JWT_AUDIENCE}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Authentication__Google__Enabled: ${GOOGLE_AUTHENTICATION_ENABLED:-false}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__ExternalWorkspace__BaseCurrencyCode: ${EXTERNAL_WORKSPACE_BASE_CURRENCY:-USD}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:-172.20.0.1}
      AllowedHosts: ${ALLOWED_HOSTS}
      Attachments__StoragePath: /app/data/attachments
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    volumes:
      - attachments_data:/app/data/attachments
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-internal

  frontend:
    build:
      context: ./frontend
      args:
        GOOGLE_SIGN_IN_ENABLED: ${GOOGLE_AUTHENTICATION_ENABLED:-false}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        API_BASE_URL: ${API_BASE_URL:-/api}
    environment:
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - erp-internal

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    networks:
      - erp-internal
      - erp-public

networks:
  erp-internal:
    driver: bridge
    internal: true
  erp-public:
    driver: bridge

volumes:
  postgres_data:
  attachments_data: