# Production Nginx Configuration for ERP
# Place SSL certificates in ./ssl/ directory:
# - fullchain.pem (certificate + chain)
# - privkey.pem (private key)

# Rate limiting zones (defined in http context, but we use map for conditional limiting)
# These are defined inline for docker-compose single-file deployment

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS (except health checks and ACME challenges)
    location /health {
        access_log off;
        return 200 'Healthy';
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL Configuration (certificates mounted from ./ssl/)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy for Angular + Google Sign-In
    # Report-only mode first for testing: Content-Security-Policy-Report-Only
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self' 'unsafe-inline' https://accounts.google.com;
         style-src 'self' 'unsafe-inline';
         font-src 'self' data:;
         img-src 'self' data: https:;
         connect-src 'self' https://accounts.google.com;
         frame-src https://accounts.google.com;
         frame-ancestors 'none';
         base-uri 'self';
         form-action 'self';" always;

    # Hide nginx version
    server_tokens off;

    # Root for Angular static files
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 'Healthy';
        add_header Content-Type text/plain;
    }

    # API proxy - forwards to backend API container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Forwarded headers for ASP.NET Core
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Pass through important headers
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;

        # No cache for API
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Attachments proxy (if serving from API)
    location /api/documents/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for file downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Angular SPA routing - serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # No cache for HTML
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/manifest+json
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        font/eot
        font/opentype
        font/otf
        image/svg+xml;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client body size limit (for file uploads)
    client_max_body_size 12M;
}